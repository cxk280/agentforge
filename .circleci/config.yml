# AgentForge CI/CD pipeline.
#
# Deploy mechanism: GitHub-source Railway services. Each Railway service
# (copilot-agent + openemr × dev/qa/prod) is connected to this repo and
# watches a per-env branch:
#
#     dev  → master   (auto-deploys on every master push)
#     qa   → qa       (CI promotes via `git push origin <sha>:qa`)
#     prod → prod     (CI promotes via `git push origin <sha>:prod`)
#
# CI's role is to gate promotions — never to deploy directly. The old
# `railway up` model let any workstation token sidestep CI; switching
# to GitHub-source + branch-watch closes that door. See
# project_branch_protection_lockdown memory for the full motivation.
#
# Stages:
#   1.  unit-test                 — isolated PHPUnit Copilot suite. Both lanes.
#   1b. agent-unit-test           — Python unit tests for the agent (PHI redaction
#                                   + hybrid retriever contract). Gates the agent
#                                   lane only — openemr deploys don't depend on
#                                   agent Python code.
#   2.  eval-smoke-agent-dev      — 5-case smoke against dev's agent (~$0.05).
#                                   No explicit dev deploy step: master push
#                                   auto-deploys dev's Railway services in
#                                   parallel; the eval first polls /version
#                                   until git_commit_sha matches CIRCLE_SHA1.
#   3.  smoke-openemr-dev         — wait for login + re-run copilot_enable_api.php
#                                   (the REGISTERED/REFRESHED marker doubles as
#                                   "fork code is deployed" proof).
#   4.  hold-qa, hold-prod        — manual approval gates after BOTH lane's
#                                   previous-env verifications pass.
#   5.  promote-{qa,prod}         — single git push that triggers BOTH Railway
#                                   services' auto-deploy on the env branch.
#                                   Also tags the SHA <env>-YYYY-MM-DD-N for
#                                   audit history (Railway can't watch tags;
#                                   the tag is purely a chronological log).
#   6.  eval-full-agent-{qa,prod} — full 50-case eval; threshold 46/50.
#                                   Polls /version for SHA match before evaluating.
#   7.  smoke-openemr-{qa,prod}   — same shape as dev, against the env's openemr.
#
# Auto-rollback (prod only):
#   If eval-full-agent-prod or smoke-openemr-prod fails, that job's
#   `rollback-to-previous-tag` step (when: on_fail) force-pushes the
#   previous prod-YYYY-MM-DD-N tag's SHA back to the `prod` branch.
#   Railway redeploys the prior known-good state automatically. The
#   rollback itself is audit-tagged `prod-rollback-YYYY-MM-DD-<build>`.
#   QA has NO auto-rollback by design — qa is "staging where you catch
#   things," and leaving the broken SHA up briefly is useful for
#   inspection.
#
# Required CircleCI project env vars (Settings → Environment Variables):
#   ANTHROPIC_API_KEY              — for Haiku judge in evals
#   ADVERSARY_API_TOKEN            — bearer for the adversary-agent's
#                                    /regression-runs API. Used by the
#                                    adversary-gate-dev job to launch a
#                                    promotion-gate-v1 campaign against the
#                                    just-deployed dev Co-Pilot, and to fail
#                                    the gate if new high-severity exploits
#                                    appear vs. the baseline.
#   GITHUB_APP_ID                  — numeric App ID of the AgentForge CI
#                                    Promoter App. App needs Contents:
#                                    Read & Write on cxk280/agentforge.
#   GITHUB_APP_PRIVATE_KEY         — multi-line PEM (entire BEGIN/END block).
#                                    CircleCI supports newlines in env values.
#   GITHUB_APP_INSTALLATION_ID     — installation ID for the App on this
#                                    repo (visible at /settings/installations).
#   OE_USER_DEPLOY                 — OpenEMR admin username for smoke (default: admin)
#   OE_PASS_DEPLOY                 — OpenEMR admin password for smoke (default: pass)
#
# No longer used (lockdown 2026-05-08):
#   GITHUB_DEPLOY_TOKEN            — replaced by GitHub App installation
#                                    tokens (bot-only push isolation).
#                                    Revoke the PAT once the App-based
#                                    pipeline is verified end-to-end.
#   RAILWAY_TOKEN_DEV / QA / PROD  — replaced by git-push promotion. Revoke
#                                    the Railway project tokens once you've
#                                    verified this pipeline is the only
#                                    deploy path.
#   LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST — see
#                                    the run-evals command for why we strip
#                                    these instead of using them.
#
# Why openemr deploys aren't risky to the MySQL volume: pushing to an env
# branch rebuilds the openemr container only. The MySQL service is a
# separate Railway service with its own volume; this pipeline never
# touches it. The OpenEMR container's bind-mount volumes (sites/,
# public/themes/, public/assets/, vendor/, node_modules/) survive redeploy
# too. See project_railway_deploy_2026-04-30 memory.

version: 2.1

orbs:
  node: circleci/node@5

executors:
  python:
    docker:
      - image: cimg/python:3.13
    resource_class: small
  base:
    docker:
      - image: cimg/base:stable
    resource_class: small
  php:
    docker:
      - image: cimg/php:8.2
        environment:
          OE_USER: admin
          OE_PASS: pass
      - image: mysql:9.4
        environment:
          MYSQL_ROOT_PASSWORD: openemr
          MYSQL_DATABASE: openemr
          MYSQL_USER: openemr
          MYSQL_PASSWORD: openemr
    resource_class: medium

# ─── Reusable command bundles ────────────────────────────────────────────
commands:
  promote-to-env-branch:
    description: |
      Push the current commit to a target env branch (qa/prod) AND
      tag it as <env>-YYYY-MM-DD-N for audit history.

      The branch push is the deploy trigger — Railway services watch
      qa/prod and auto-deploy on push. Railway can't watch tags
      (verified 2026-05-09 via Railway docs/dashboard), so the tag is
      audit-only: `git tag -l 'qa-*'` enumerates every promotion in
      chronological order.

      Auth: GitHub App installation token (NOT a user PAT). The App
      identity is the only one allowed to push to qa/prod under branch
      protection, so even a user with repo write access can't sidestep
      CI. See project_bot_only_push_isolation memory for the rationale
      and scripts/mint-github-installation-token.py for the token mint.
    parameters:
      env_branch:
        type: string
    steps:
      - checkout
      - run:
          name: Mint GitHub App installation token
          command: |
            for var in GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_APP_INSTALLATION_ID; do
              if [ -z "$(eval echo \$$var)" ]; then
                echo "✗ $var not set — cannot promote." >&2
                echo "  See project_bot_only_push_isolation memory for setup." >&2
                exit 1
              fi
            done
            pip install --quiet 'PyJWT[crypto]'
            TOKEN=$(python3 scripts/mint-github-installation-token.py)
            if [ -z "$TOKEN" ]; then
              echo "✗ Token mint returned empty — see stderr above." >&2
              exit 1
            fi
            # Stash for the next step. echo to BASH_ENV scopes it to
            # subsequent steps in the same job; the token is short-
            # lived (~1 hr) and the job ends in seconds anyway.
            echo "export GH_INSTALLATION_TOKEN=$TOKEN" >> "$BASH_ENV"
            echo "✓ Minted installation token (length=${#TOKEN})"
      - run:
          name: Push HEAD → << parameters.env_branch >>
          command: |
            # Push the SHA (not a branch ref) so a stray master move
            # mid-pipeline can't sneak a different commit into qa/prod.
            git push \
              "https://x-access-token:${GH_INSTALLATION_TOKEN}@github.com/cxk280/agentforge.git" \
              "${CIRCLE_SHA1}:refs/heads/<< parameters.env_branch >>"
            echo "✓ Pushed ${CIRCLE_SHA1} → << parameters.env_branch >>"
      - run:
          name: Tag promotion as << parameters.env_branch >>-YYYY-MM-DD-N
          command: |
            ENV="<< parameters.env_branch >>"
            TODAY=$(date -u +%Y-%m-%d)
            AUTH_URL="https://x-access-token:${GH_INSTALLATION_TOKEN}@github.com/cxk280/agentforge.git"
            # Count today's existing tags for this env via ls-remote
            # (server-authoritative — survives parallel/retried jobs
            # better than a local tag list). grep exits 1 when zero
            # matches, hence the `|| true`.
            EXISTING=$(git ls-remote --tags "$AUTH_URL" \
              | grep -cE "refs/tags/${ENV}-${TODAY}-[0-9]+\$" \
              || true)
            N=$((EXISTING + 1))
            TAG="${ENV}-${TODAY}-${N}"
            git -c user.email="ci@agentforge.local" \
                -c user.name="AgentForge CI Promoter" \
                tag -a "${TAG}" "${CIRCLE_SHA1}" \
                -m "Promote ${CIRCLE_SHA1:0:7} → ${ENV}"
            git push "$AUTH_URL" "refs/tags/${TAG}"
            echo "✓ Tagged ${CIRCLE_SHA1:0:7} as ${TAG}"

  rollback-to-previous-tag:
    description: |
      Roll an env branch back to the second-most-recent promotion
      tag. Pairs with promote-to-env-branch — its audit tags
      (<env>-YYYY-MM-DD-N) are the rollback source. Railway redeploys
      automatically once the branch tip moves.

      The single inner step is gated `when: on_fail`, so calling this
      command at the end of a verification job is a no-op on success
      and fires the rollback only when an earlier step in the same
      job failed.

      Concurrency: when eval-full + smoke-openemr both fail in the
      same workflow, both jobs compute the same previous SHA and
      force-push it idempotently. Each rollback tag uses
      CIRCLE_BUILD_NUM as its suffix so the parallel audit records
      don't collide on the remote.

      Auth: same GitHub App installation token the forward promote
      uses. The App identity is the only one allowed to push to
      qa/prod under branch protection.
    parameters:
      env_branch:
        type: string
    steps:
      - run:
          name: Roll << parameters.env_branch >> back to previous audit tag
          when: on_fail
          command: |
            ENV="<< parameters.env_branch >>"
            # cimg/base lacks python3 by default; install on the fly so
            # this command works on either executor (the forward promote
            # only runs on cimg/python and could rely on it being there).
            if ! command -v python3 >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -qq -y python3 python3-pip
            fi
            for var in GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_APP_INSTALLATION_ID; do
              if [ -z "$(eval echo \$$var)" ]; then
                echo "✗ $var not set — cannot rollback ${ENV}." >&2
                exit 1
              fi
            done
            python3 -m pip install --quiet 'PyJWT[crypto]'
            TOKEN=$(python3 scripts/mint-github-installation-token.py)
            if [ -z "$TOKEN" ]; then
              echo "✗ Token mint returned empty — see stderr above." >&2
              exit 1
            fi
            AUTH_URL="https://x-access-token:${TOKEN}@github.com/cxk280/agentforge.git"
            # ls-remote output is "<sha>\trefs/tags/<name>"; awk to
            # "<sha> <ref>" so sort -V on -k2 orders by tag name with
            # numeric awareness (so qa-...-10 sorts after qa-...-2,
            # not after qa-...-1).
            TAGS=$(git ls-remote --tags "$AUTH_URL" \
              | grep -E "refs/tags/${ENV}-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+\$" \
              | awk '{print $1" "$2}' \
              | sort -k2 -V)
            COUNT=$(printf '%s\n' "$TAGS" | grep -cv '^$')
            if [ "$COUNT" -lt 2 ]; then
              echo "✗ only ${COUNT} promotion tag(s) for ${ENV} — no rollback target." >&2
              echo "  Manual recovery required (no prior known-good state to revert to)." >&2
              exit 1
            fi
            PREV_LINE=$(printf '%s\n' "$TAGS" | tail -2 | head -1)
            PREV_SHA=$(echo "$PREV_LINE" | awk '{print $1}')
            PREV_TAG=$(echo "$PREV_LINE" | awk '{print $2}' | sed 's|refs/tags/||')
            echo "↩ Rolling ${ENV} back to ${PREV_TAG} (${PREV_SHA:0:7})..."
            # Force-push the previous SHA as the env branch tip.
            # Railway autodeploys on push.
            git push --force "$AUTH_URL" "${PREV_SHA}:refs/heads/${ENV}"
            # Tag this rollback so `git tag -l '<env>-rollback-*'`
            # enumerates rollback events. CIRCLE_BUILD_NUM keeps the
            # name unique when parallel jobs both fail.
            TODAY=$(date -u +%Y-%m-%d)
            ROLLBACK_TAG="${ENV}-rollback-${TODAY}-${CIRCLE_BUILD_NUM}"
            git -c user.email="ci@agentforge.local" \
                -c user.name="AgentForge CI Promoter" \
                tag -a "${ROLLBACK_TAG}" "${PREV_SHA}" \
                -m "Roll back ${ENV} to ${PREV_TAG} after post-deploy failure (build ${CIRCLE_BUILD_NUM})"
            git push "$AUTH_URL" "refs/tags/${ROLLBACK_TAG}"
            echo "✓ Rolled back ${ENV} to ${PREV_SHA:0:7} as ${ROLLBACK_TAG}"

  wait-for-agent-sha:
    description: |
      Poll the agent's /version endpoint until git_commit_sha matches
      CIRCLE_SHA1. This is how we know Railway has finished its
      auto-deploy and is no longer routing traffic to the previous
      container. /version reads RAILWAY_GIT_COMMIT_SHA, which Railway
      populates per build for GitHub-source services.
    parameters:
      base_url:
        type: string
      timeout_seconds:
        type: integer
        default: 900
    steps:
      - run:
          name: Wait for << parameters.base_url >> /version SHA = $CIRCLE_SHA1
          no_output_timeout: << parameters.timeout_seconds >>s
          command: |
            DEADLINE=$(($(date +%s) + << parameters.timeout_seconds >>))
            EXPECTED="${CIRCLE_SHA1}"
            BASE="<< parameters.base_url >>"
            while true; do
              ACTUAL=$(curl -sS "$BASE/version" 2>/dev/null \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('git_commit_sha','unknown'))" 2>/dev/null \
                || echo "unknown")
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "✓ $BASE deployed at $EXPECTED"
                break
              fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "✗ Timeout: expected $EXPECTED, last seen $ACTUAL" >&2
                exit 1
              fi
              echo "  waiting… last_seen=${ACTUAL:0:7} expected=${EXPECTED:0:7}"
              sleep 30
            done

  wait-for-url:
    description: "Poll a URL until it returns 200, with timeout"
    parameters:
      url:
        type: string
      timeout_seconds:
        type: integer
        default: 600
    steps:
      - run:
          name: Wait for << parameters.url >>
          no_output_timeout: << parameters.timeout_seconds >>s
          command: |
            DEADLINE=$(($(date +%s) + << parameters.timeout_seconds >>))
            until [ "$(curl -s -o /dev/null -w '%{http_code}' << parameters.url >>)" = "200" ]; do
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "Timeout waiting for << parameters.url >>"; exit 1
              fi
              sleep 30
            done
            echo "Up: << parameters.url >>"

  openemr-smoke:
    description: |
      Post-deploy housekeeping + smoke test for an OpenEMR Railway
      service. Three steps in one command bundle so each env's deploy
      job ends with a verified-up state instead of just "container
      started":

        1. Wait for /interface/login/login.php to return 200 (up to
           15 min — first-boot composer install + gulp + DB schema
           bootstrap takes 8-12 min).
        2. POST login as admin/pass to obtain a session cookie.
        3. GET /interface/super/copilot_enable_api.php?confirm=1 to
           re-register the OAuth client. OpenEMR's flex image
           sometimes loses the OAuth client config across deploys —
           the script is idempotent, so running it every deploy is
           cheaper than debugging a missing-client failure later.
           This step doubles as the authenticated-render check: a
           successful response (with "REGISTERED" or "REFRESHED"
           text) proves both that the admin session is real AND
           that the AgentForge fork is what's serving requests
           (this script is fork-only).

      Failure at any step exits non-zero so the workflow gates
      register the deploy as broken.

      Past life: there was a step 4 that GET'd main_screen.php to
      confirm an OpenEMR shell rendered. That endpoint now CSRF-403s
      on pure GETs after PR #11379 (2026-04-01) wired
      CsrfUtils::checkCsrfInput() into the non-new-login else branch,
      and step 3 already covers the same ground.
    parameters:
      base_url:
        type: string
      timeout_seconds:
        type: integer
        default: 900
    steps:
      - wait-for-url:
          url: "<< parameters.base_url >>/interface/login/login.php"
          timeout_seconds: << parameters.timeout_seconds >>
      - run:
          name: Login + API enable + render smoke
          command: |
            mkdir -p /tmp/openemr-smoke
            COOKIES=/tmp/openemr-smoke/cookies.txt
            BASE="<< parameters.base_url >>"
            USER="${OE_USER_DEPLOY:-admin}"
            PASS="${OE_PASS_DEPLOY:-pass}"

            # 1. Land on login.php to receive an OpenEMR session cookie.
            curl -fsS -c "$COOKIES" -o /dev/null "$BASE/interface/login/login.php"

            # 2. POST credentials. OpenEMR redirects to main on
            #    success; failure surfaces with a 200 + the same
            #    login form re-rendered. We grep the next page to
            #    confirm we're past the login wall.
            curl -fsS -b "$COOKIES" -c "$COOKIES" -o /tmp/openemr-smoke/post-login.html \
                -X POST "$BASE/interface/main/main_screen.php?auth=login&site=default" \
                --data-urlencode "authUser=$USER" \
                --data-urlencode "clearPass=$PASS" \
                --data-urlencode "languageChoice=1" \
                --data-urlencode "new_login_session_management=1"
            if grep -q 'name="authUser"' /tmp/openemr-smoke/post-login.html; then
              echo "✗ Login failed for $USER@$BASE — login form re-rendered (bad creds or session config)" >&2
              exit 1
            fi

            # 3. Re-register the OAuth client. Idempotent.
            #
            # Two-sided check — must see a positive registration marker
            # AND must NOT see any of the failure tells. The previous
            # version only printed a warning and proceeded; that let an
            # entirely-empty openemr DB pass smoke (the body was just
            # "SQL Statement failed on preparation: ..." which didn't
            # match the lenient grep). 2026-05-07.
            curl -fsS -b "$COOKIES" -o /tmp/openemr-smoke/api-enable.html \
                "$BASE/interface/super/copilot_enable_api.php?confirm=1"

            if grep -qE "SQL Statement failed|Table .* doesn'?t exist|Authentication Error|Admin access required" \
                 /tmp/openemr-smoke/api-enable.html; then
              echo "✗ copilot_enable_api.php returned a database/auth error — see artifact" >&2
              echo "    head of body:" >&2
              head -c 400 /tmp/openemr-smoke/api-enable.html >&2 || true
              echo >&2
              exit 1
            fi

            if ! grep -qE "REGISTERED agent OAuth client|REFRESHED agent OAuth client" \
                 /tmp/openemr-smoke/api-enable.html; then
              echo "✗ copilot_enable_api.php did not REGISTER or REFRESH the agent client — see artifact" >&2
              exit 1
            fi

            echo "✓ OpenEMR smoke passed for $BASE"
      - store_artifacts:
          path: /tmp/openemr-smoke
          destination: openemr-smoke

  run-evals:
    description: |
      Run the eval suite against a target endpoint. The endpoint MUST match the
      environment the eval job runs in: dev jobs hit dev, qa hits qa, prod hits
      prod. Never cross environments — see feedback_evals_match_environment in
      project memory and SECURITY.md isolation rules.
    parameters:
      endpoint:
        type: string
      smoke:
        type: boolean
        default: false
      min_pass:
        type: integer
        default: 23
    steps:
      # Two-step structure: capture run output unconditionally, then enforce
      # the threshold in a separate gate step. That way store_artifacts
      # below always runs — failure logs are the most useful artifacts.
      - run:
          name: Run evals (capture output)
          command: |
            mkdir -p /tmp/eval-artifacts
            cd copilot/agent/evals
            python -m venv .venv
            source .venv/bin/activate
            pip install -q -r requirements.txt
            export EVAL_AGENT_ENDPOINT="<< parameters.endpoint >>"
            # Silence the Langfuse SDK in CI: the only LANGFUSE_* keys
            # available at the project level are prod-scoped (they have
            # the wrong audience for dev/qa Langfuse instances and a
            # trailing-whitespace artifact that makes the SDK 401 on
            # every export). Per feedback_environment_isolation, evals
            # must NOT upload to a cross-env Langfuse instance. Until
            # we wire per-env CircleCI contexts, drop the keys here so
            # the runner short-circuits to the no-Langfuse path and the
            # SDK never tries to export.
            unset LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY LANGFUSE_HOST
            ARGS="--no-langfuse"
            if [ "<< parameters.smoke >>" = "true" ]; then ARGS="$ARGS --smoke"; fi
            python run_evals.py $ARGS 2>&1 | tee /tmp/eval-artifacts/eval-output.txt || true
            cp cases.json /tmp/eval-artifacts/cases.json
      - store_artifacts:
          path: /tmp/eval-artifacts
          destination: evals
      - run:
          name: Enforce pass threshold
          # Delegates to copilot/agent/evals/threshold_gate.py — a tested
          # Python module replacing the previous bash grep+awk one-liner.
          # Edge cases (missing TOTAL line, exact-equal pass count, zero
          # threshold) are covered by test_threshold_gate.py so a future
          # change to run_evals.py's output format fails the unit suite
          # before it ships.
          command: |
            cd copilot/agent/evals
            python -m threshold_gate /tmp/eval-artifacts/eval-output.txt \
              --min-pass << parameters.min_pass >>

  adversary-gate:
    description: |
      Launch a promotion-gate-v1 campaign against the just-deployed
      Co-Pilot via the adversary platform's /regression-runs API, then
      poll the run until it terminates and exit on the gate verdict.
      Lives in the separate `adversarial_ai_security_agentforge` repo;
      its dev surface is reachable at
      https://adversary-agent-dev.up.railway.app.

      The gate fails when the run discovers one or more new high-
      severity exploits vs. the baseline target SHA. A `pass` verdict
      means the deployed agent held all attacks at or above its 7-day
      baseline; `error` is treated as a hard fail too (treat infra
      breakage as gate failure rather than silently proceeding).

      Auth: ADVERSARY_API_TOKEN must be set on the CircleCI project
      (bearer for the adversary-agent's bearer-token middleware). The
      adversary platform enforces a target-host allowlist server-
      side; sending a non-allowlisted target_url returns 422 before
      any HTTP call leaves the platform.

      Budget cap: the adversary-agent's own /regression-runs gate at
      $5/day per env applies regardless of what we pass here.
    parameters:
      target_url:
        type: string
      adversary_base:
        type: string
        default: "https://adversary-agent-dev.up.railway.app"
      suite_ref:
        type: string
        default: "promotion-gate-v1"
      timeout_seconds:
        type: integer
        default: 900
      budget_usd:
        type: string
        default: "0.50"
    steps:
      - run:
          name: Verify ADVERSARY_API_TOKEN is set
          command: |
            if [ -z "${ADVERSARY_API_TOKEN}" ]; then
              echo "✗ ADVERSARY_API_TOKEN not set — cannot run adversary gate." >&2
              echo "  Set it under CircleCI project Settings → Environment Variables." >&2
              exit 1
            fi
            echo "✓ ADVERSARY_API_TOKEN present (length=${#ADVERSARY_API_TOKEN})"
      - run:
          name: Launch adversary regression run against << parameters.target_url >>
          command: |
            BODY=$(python3 -c "
            import json
            print(json.dumps({
                'target_url': '<< parameters.target_url >>',
                'suite_ref': '<< parameters.suite_ref >>',
                'source': 'circleci',
                'commit_sha': '${CIRCLE_SHA1}',
                'max_seconds': << parameters.timeout_seconds >>,
                'budget_usd': float('<< parameters.budget_usd >>'),
            }))")
            RESP=$(curl -sS -X POST "<< parameters.adversary_base >>/regression-runs" \
              -H "Authorization: Bearer ${ADVERSARY_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            RUN_ID=$(echo "$RESP" | python3 -c "
            import sys, json
            try:
                d = json.load(sys.stdin)
                rid = d.get('run_id')
                if not rid:
                    sys.stderr.write('No run_id in response: ' + json.dumps(d) + chr(10))
                    sys.exit(1)
                print(rid)
            except json.JSONDecodeError:
                sys.stderr.write('Non-JSON response from /regression-runs' + chr(10))
                sys.exit(1)
            ")
            if [ -z "$RUN_ID" ]; then
              echo "✗ Failed to launch adversary run. Response: $RESP" >&2
              exit 1
            fi
            echo "✓ Launched run_id=${RUN_ID}"
            echo "  Dashboard: << parameters.adversary_base >>/runs/${RUN_ID}"
            echo "export ADVERSARY_RUN_ID=${RUN_ID}" >> "$BASH_ENV"
      - run:
          name: Poll run until gate verdict (timeout << parameters.timeout_seconds >>s)
          no_output_timeout: << parameters.timeout_seconds >>s
          command: |
            DEADLINE=$(($(date +%s) + << parameters.timeout_seconds >>))
            while true; do
              RESP=$(curl -sS \
                -H "Authorization: Bearer ${ADVERSARY_API_TOKEN}" \
                "<< parameters.adversary_base >>/regression-runs/${ADVERSARY_RUN_ID}")
              STATE=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))" 2>/dev/null || echo unknown)
              case "$STATE" in
                completed|failed|cancelled)
                  echo "↳ run terminal: state=${STATE}"
                  echo "$RESP" | python3 -m json.tool | head -40
                  VERDICT=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('gate') or {}).get('verdict','error'))")
                  echo "$RESP" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            t = d.get('totals') or {}
            spend = d.get('spend_usd') or 0
            print(f\"  totals: pass={t.get('pass',0)} fail={t.get('fail',0)} partial={t.get('partial',0)} inconclusive={t.get('inconclusive',0)}\")
            print(f\"  spend:  \${spend:.4f}\")
            for r in ((d.get('gate') or {}).get('reasons') or []):
                print(f\"  reason: {r}\")
            "
                  if [ "$VERDICT" = "pass" ]; then
                    echo "✓ adversary-gate PASS"
                    exit 0
                  fi
                  echo "✗ adversary-gate FAIL (verdict=${VERDICT})" >&2
                  echo "  See << parameters.adversary_base >>/runs/${ADVERSARY_RUN_ID} for per-attempt detail." >&2
                  exit 1
                  ;;
              esac
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "✗ Timeout waiting for run ${ADVERSARY_RUN_ID} (last state=${STATE})" >&2
                exit 1
              fi
              echo "  waiting… state=${STATE}"
              sleep 20
            done

# ─── Jobs ────────────────────────────────────────────────────────────────
jobs:
  unit-test:
    executor: php
    steps:
      - checkout
      - run:
          name: Install PHP deps
          # The isolated suite needs no PHP extensions at runtime — it
          # exercises plain classes with no DB, no curl, no redis. Bypass
          # composer's platform-req check so we don't have to install a
          # full LAMP-style PHP image just to run unit tests.
          command: |
            composer install \
              --no-interaction --prefer-dist --no-scripts \
              --ignore-platform-reqs
      - run:
          name: Run isolated PHPUnit Copilot suite
          command: |
            mkdir -p /tmp/test-results
            ./vendor/bin/phpunit \
              -c phpunit-isolated.xml \
              --filter Copilot \
              --log-junit /tmp/test-results/junit.xml
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: phpunit

  agent-unit-test:
    # Python unit tests for the FastAPI agent. Runs on every push, gates
    # the agent deploy lane. Adding test files? Drop them at
    # copilot/agent/test_*.py — the unittest discover below picks them up
    # automatically.
    #
    # Why install rank-bm25 explicitly: the hybrid retriever imports it
    # at module import time. Voyage SDK is NOT installed — the test
    # injects a fake voyageai module before importing the retriever, so
    # the dense path is exercised without burning real Voyage budget.
    executor: python
    steps:
      - checkout
      - run:
          name: Install agent test deps
          command: |
            python -m pip install --upgrade pip
            # Pin to the runtime-only deps the tests actually exercise
            # (BM25 + rerank fallback + Pydantic for the agent schemas).
            # Heavy deps like anthropic / langgraph / newrelic / langfuse
            # are stubbed in the tests, so we don't pay to install them.
            pip install rank-bm25 'pydantic>=2.9.0'
      - run:
          name: Run Python unit tests
          command: |
            mkdir -p /tmp/test-results/agent
            cd copilot/agent
            python -m unittest discover \
              --start-directory . \
              --pattern 'test_*.py' \
              --verbose \
              2>&1 | tee /tmp/test-results/agent/unittest-output.txt
      - store_artifacts:
          path: /tmp/test-results/agent
          destination: agent-unit-test

  eval-smoke-agent-dev:
    executor: python
    steps:
      - checkout
      - wait-for-agent-sha:
          base_url: "https://copilot-agent-dev.up.railway.app"
      - run-evals:
          endpoint: "https://copilot-agent-dev.up.railway.app/chat"
          smoke: true
          min_pass: 4

  adversary-gate-dev:
    # Multi-agent adversarial regression suite against the just-
    # deployed dev Co-Pilot. Gate verdict is read from the W3
    # platform's /regression-runs API; the run record + per-attempt
    # response evidence persist in adversary-agent's own SQLite DB
    # for audit. Runs in parallel with eval-smoke-agent-dev and
    # smoke-openemr-dev; gates hold-qa.
    #
    # Cross-repo note: this job lives in the W2 (agentforge) pipeline
    # but calls the adversary platform in the *separate* W3 repo
    # (adversarial_ai_security_agentforge). CIRCLE_SHA1 here is a W2
    # commit, so wait-for-agent-sha (which expects /version to report
    # CIRCLE_SHA1) would never match. Instead we use wait-for-url to
    # confirm the adversary-agent is reachable, then launch the gate
    # campaign. Adversary platform's own pipeline gates its own SHA
    # matching.
    executor: python
    steps:
      - checkout
      - wait-for-url:
          url: "https://adversary-agent-dev.up.railway.app/health"
          timeout_seconds: 120
      - adversary-gate:
          target_url: "https://copilot-agent-dev.up.railway.app"
          adversary_base: "https://adversary-agent-dev.up.railway.app"

  promote-qa:
    executor: python
    steps:
      - promote-to-env-branch:
          env_branch: qa

  eval-full-agent-qa:
    executor: python
    steps:
      - checkout
      - wait-for-agent-sha:
          base_url: "https://copilot-agent-qa.up.railway.app"
      - run-evals:
          endpoint: "https://copilot-agent-qa.up.railway.app/chat"
          smoke: false
          min_pass: 46

  promote-prod:
    executor: python
    steps:
      - promote-to-env-branch:
          env_branch: prod

  eval-full-agent-prod:
    executor: python
    steps:
      - checkout
      - wait-for-agent-sha:
          base_url: "https://copilot-agent-production-41de.up.railway.app"
      - run-evals:
          endpoint: "https://copilot-agent-production-41de.up.railway.app/chat"
          smoke: false
          min_pass: 46
      # Auto-rollback prod if any of the steps above failed. The
      # rollback step is gated `when: on_fail`, so this is a no-op
      # when evals pass. See rollback-to-previous-tag (commands).
      - rollback-to-previous-tag:
          env_branch: prod

  # ─── OpenEMR lane ────────────────────────────────────────────────────
  #
  # No deploy-openemr-* jobs anymore — Railway's GitHub-source services
  # auto-deploy on env-branch push. The smoke jobs themselves wait for
  # login.php to come back up + run copilot_enable_api as a fork-code
  # liveness check. The "REGISTERED" / "REFRESHED" marker is what proves
  # our fork is what's serving requests; if Railway is still routing to
  # the previous container it'll still 200 on login.php but the smoke's
  # admin POST will fail because the new client_id/secret hasn't taken
  # effect yet.
  #
  # Per project_railway_deploy_2026-04-30 memory: never set EASY_DEV_MODE
  # on prod openemr (entrypoint rsync loop), keep OE_PASS=pass on each
  # env, and don't touch MySQL services.

  smoke-openemr-dev:
    executor: base
    steps:
      - checkout
      - openemr-smoke:
          base_url: "https://openemr-dev-59c5.up.railway.app"

  smoke-openemr-qa:
    executor: base
    steps:
      - checkout
      - openemr-smoke:
          base_url: "https://openemr-qa.up.railway.app"

  smoke-openemr-prod:
    executor: base
    steps:
      - checkout
      - openemr-smoke:
          base_url: "https://openemr-production-971e.up.railway.app"
      # Auto-rollback prod if the smoke failed. cimg/base lacks
      # python3, but rollback-to-previous-tag installs it on the
      # fly. See rollback-to-previous-tag (commands).
      - rollback-to-previous-tag:
          env_branch: prod

# ─── Workflows ───────────────────────────────────────────────────────────
workflows:
  test-deploy-promote:
    # Skip CI entirely on qa/prod pushes. Those pushes come from
    # promote-{qa,prod} jobs in the master pipeline (or a manual
    # `git push <sha>:qa`) and exist purely to trigger Railway's
    # GitHub-source auto-deploy on the env branch. The QA/prod
    # verification jobs (eval-full-agent-{qa,prod}, smoke-openemr-
    # {qa,prod}) run inside the master pipeline after promote-{qa,
    # prod}, polling /version until Railway has rolled out the new
    # SHA — they don't need to run a second time on the qa/prod
    # branch's own pipeline. Without this gate, every promotion
    # spawns a redundant CI run that only re-executes unit-test +
    # agent-unit-test against the same SHA already verified on
    # master.
    when:
      not:
        or:
          - equal: [ qa, << pipeline.git.branch >> ]
          - equal: [ prod, << pipeline.git.branch >> ]
    jobs:
      # ── Unit tests gate every promotion ────────────────────────
      # Isolated PHPUnit Copilot suite + Python agent unit tests.
      - unit-test
      - agent-unit-test

      # ── Dev verification (no deploy step — master push auto-
      #    deploys both Railway dev services in parallel) ────────
      - eval-smoke-agent-dev:
          requires: [unit-test, agent-unit-test]
          filters:
            branches:
              only: master
      - smoke-openemr-dev:
          requires: [unit-test]
          filters:
            branches:
              only: master
      # ── Adversary regression gate (W3 platform) ──────────────
      # Launched in parallel with eval-smoke-agent-dev; both lanes
      # must clear before promotion. See the `adversary-gate`
      # command bundle for the full request/poll/verdict flow.
      - adversary-gate-dev:
          requires: [unit-test, agent-unit-test]
          filters:
            branches:
              only: master

      # ── QA gate: ALL dev verifications must pass ─────────────
      - hold-qa:
          type: approval
          requires: [eval-smoke-agent-dev, smoke-openemr-dev, adversary-gate-dev]

      # ── QA promotion: single git push to qa branch triggers
      #    BOTH Railway services' auto-deploy ──────────────────
      - promote-qa:
          requires: [hold-qa]
      - eval-full-agent-qa:
          requires: [promote-qa]
      - smoke-openemr-qa:
          requires: [promote-qa]

      # ── Prod gate: BOTH lanes' QA verifications must pass ────
      - hold-prod:
          type: approval
          requires: [eval-full-agent-qa, smoke-openemr-qa]

      # ── Prod promotion ──────────────────────────────────────
      - promote-prod:
          requires: [hold-prod]
      - eval-full-agent-prod:
          requires: [promote-prod]
      - smoke-openemr-prod:
          requires: [promote-prod]
