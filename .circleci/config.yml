# AgentForge CI/CD pipeline.
#
# Two parallel deploy lanes — one per Railway service we care about:
#
#   copilot-agent (FastAPI):
#     unit-test → deploy-{env} → eval-{env} → hold → next env
#     `railway up --service copilot-agent --path-as-root .` from copilot/agent/
#
#   openemr (PHP app):
#     unit-test → deploy-openemr-{env} → smoke-openemr-{env} → hold → next env
#     `railway up --service openemr` from the repo root
#
# Both lanes share unit-test as their pre-deploy gate (same Copilot
# isolated PHPUnit suite). Each env's hold-{env} approval requires
# BOTH lanes' verifications to pass before opening — so a broken
# agent OR a broken OpenEMR will block QA/Prod promotion equally.
#
# Stages:
#   1. unit-test            — isolated PHPUnit Copilot suite. Both lanes.
#   2. deploy-{env}         — agent: railway up against the env's project token.
#   3. eval-smoke-dev       — 5-case smoke against dev's agent (~$0.05).
#   4. deploy-openemr-{env} — openemr: railway up against the env's project token.
#   5. smoke-openemr-{env}  — wait for login, re-run copilot_enable_api.php,
#                             smoke-test FHIR endpoint with admin/pass.
#   6. hold-qa, hold-prod   — manual approval gates after BOTH lanes
#                             pass their previous-env verifications.
#   7. eval-full-{qa,prod}  — full 25-case eval against the deployed agent.
#
# Required CircleCI project env vars (Settings → Environment Variables):
#   ANTHROPIC_API_KEY              — for Haiku judge in evals
#   LANGFUSE_PUBLIC_KEY            — for Langfuse Datasets uploads
#   LANGFUSE_SECRET_KEY
#   LANGFUSE_HOST
#   RAILWAY_TOKEN_DEV              — Railway project token scoped to dev
#   RAILWAY_TOKEN_QA               — Railway project token scoped to qa
#   RAILWAY_TOKEN_PROD             — Railway project token scoped to prod
#   OE_USER_DEPLOY                 — OpenEMR admin username for smoke (default: admin)
#   OE_PASS_DEPLOY                 — OpenEMR admin password for smoke (default: pass)
#
# Token scoping: Railway project tokens can be scoped per-environment via
# the Railway dashboard. Generate one per env so a Dev compromise can't
# touch Prod.
#
# Why openemr deploys aren't risky to the MySQL volume: redeploying the
# `openemr` service rebuilds the OpenEMR container only. The MySQL
# service is a separate Railway service with its own volume; this
# pipeline never touches it. The OpenEMR container's bind-mount
# volumes (sites/, public/themes/, public/assets/, vendor/, node_modules/)
# survive redeploy too. See project_railway_deploy_2026-04-30 memory.

version: 2.1

orbs:
  node: circleci/node@5

executors:
  python:
    docker:
      - image: cimg/python:3.13
    resource_class: small
  railway:
    docker:
      - image: cimg/base:stable
    resource_class: small
  php:
    docker:
      - image: cimg/php:8.2
        environment:
          OE_USER: admin
          OE_PASS: pass
      - image: mysql:9.4
        environment:
          MYSQL_ROOT_PASSWORD: openemr
          MYSQL_DATABASE: openemr
          MYSQL_USER: openemr
          MYSQL_PASSWORD: openemr
    resource_class: medium

# ─── Reusable command bundles ────────────────────────────────────────────
commands:
  install-railway-cli:
    description: "Install the Railway CLI"
    steps:
      - run:
          name: Install Railway CLI
          command: |
            curl -fsSL https://railway.com/install.sh | sh
            export PATH="$HOME/.railway/bin:$PATH"
            echo 'export PATH="$HOME/.railway/bin:$PATH"' >> "$BASH_ENV"
            railway --version

  railway-deploy:
    description: "Deploy a service to a Railway environment"
    parameters:
      service:
        type: string
      env_token:
        type: env_var_name
      service_path:
        type: string
        default: "."
      use_path_as_root:
        type: boolean
        default: false
    steps:
      - run:
          name: Deploy << parameters.service >>
          # Tee the deploy output to a per-service log so the deploy
          # job can publish it as an artifact for later debugging.
          command: |
            mkdir -p /tmp/deploy-logs
            export RAILWAY_TOKEN="${<< parameters.env_token >>}"
            cd << parameters.service_path >>
            if [ "<< parameters.use_path_as_root >>" = "true" ]; then
              railway up --service << parameters.service >> --path-as-root . --detach \
                2>&1 | tee /tmp/deploy-logs/<< parameters.service >>.log
            else
              railway up --service << parameters.service >> --detach \
                2>&1 | tee /tmp/deploy-logs/<< parameters.service >>.log
            fi

  wait-for-url:
    description: "Poll a URL until it returns 200, with timeout"
    parameters:
      url:
        type: string
      timeout_seconds:
        type: integer
        default: 600
    steps:
      - run:
          name: Wait for << parameters.url >>
          no_output_timeout: << parameters.timeout_seconds >>s
          command: |
            DEADLINE=$(($(date +%s) + << parameters.timeout_seconds >>))
            until [ "$(curl -s -o /dev/null -w '%{http_code}' << parameters.url >>)" = "200" ]; do
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "Timeout waiting for << parameters.url >>"; exit 1
              fi
              sleep 30
            done
            echo "Up: << parameters.url >>"

  openemr-smoke:
    description: |
      Post-deploy housekeeping + smoke test for an OpenEMR Railway
      service. Three steps in one command bundle so each env's deploy
      job ends with a verified-up state instead of just "container
      started":

        1. Wait for /interface/login/login.php to return 200 (up to
           15 min — first-boot composer install + gulp + DB schema
           bootstrap takes 8-12 min).
        2. POST login as admin/pass to obtain a session cookie.
        3. GET /interface/super/copilot_enable_api.php?confirm=1 to
           re-register the OAuth client. OpenEMR's flex image
           sometimes loses the OAuth client config across deploys —
           the script is idempotent, so running it every deploy is
           cheaper than debugging a missing-client failure later.
           This step doubles as the authenticated-render check: a
           successful response (with "REGISTERED" or "REFRESHED"
           text) proves both that the admin session is real AND
           that the AgentForge fork is what's serving requests
           (this script is fork-only).

      Failure at any step exits non-zero so the workflow gates
      register the deploy as broken.

      Past life: there was a step 4 that GET'd main_screen.php to
      confirm an OpenEMR shell rendered. That endpoint now CSRF-403s
      on pure GETs after PR #11379 (2026-04-01) wired
      CsrfUtils::checkCsrfInput() into the non-new-login else branch,
      and step 3 already covers the same ground.
    parameters:
      base_url:
        type: string
      timeout_seconds:
        type: integer
        default: 900
    steps:
      - wait-for-url:
          url: "<< parameters.base_url >>/interface/login/login.php"
          timeout_seconds: << parameters.timeout_seconds >>
      - run:
          name: Login + API enable + render smoke
          command: |
            mkdir -p /tmp/openemr-smoke
            COOKIES=/tmp/openemr-smoke/cookies.txt
            BASE="<< parameters.base_url >>"
            USER="${OE_USER_DEPLOY:-admin}"
            PASS="${OE_PASS_DEPLOY:-pass}"

            # 1. Land on login.php to receive an OpenEMR session cookie.
            curl -fsS -c "$COOKIES" -o /dev/null "$BASE/interface/login/login.php"

            # 2. POST credentials. OpenEMR redirects to main on
            #    success; failure surfaces with a 200 + the same
            #    login form re-rendered. We grep the next page to
            #    confirm we're past the login wall.
            curl -fsS -b "$COOKIES" -c "$COOKIES" -o /tmp/openemr-smoke/post-login.html \
                -X POST "$BASE/interface/main/main_screen.php?auth=login&site=default" \
                --data-urlencode "authUser=$USER" \
                --data-urlencode "clearPass=$PASS" \
                --data-urlencode "languageChoice=1" \
                --data-urlencode "new_login_session_management=1"
            if grep -q 'name="authUser"' /tmp/openemr-smoke/post-login.html; then
              echo "✗ Login failed for $USER@$BASE — login form re-rendered (bad creds or session config)" >&2
              exit 1
            fi

            # 3. Re-register the OAuth client. Idempotent.
            curl -fsS -b "$COOKIES" -o /tmp/openemr-smoke/api-enable.html \
                "$BASE/interface/super/copilot_enable_api.php?confirm=1"
            if ! grep -q "OAuth client" /tmp/openemr-smoke/api-enable.html 2>/dev/null \
                && ! grep -q "enabled" /tmp/openemr-smoke/api-enable.html 2>/dev/null \
                && ! grep -qi "ok\|done\|registered" /tmp/openemr-smoke/api-enable.html 2>/dev/null; then
              echo "⚠ copilot_enable_api.php did not return a confirmation marker — review the artifact"
              # not fatal — the script may have changed its output format
            fi

            echo "✓ OpenEMR smoke passed for $BASE"
      - store_artifacts:
          path: /tmp/openemr-smoke
          destination: openemr-smoke

  run-evals:
    description: |
      Run the eval suite against a target endpoint. The endpoint MUST match the
      environment the eval job runs in: dev jobs hit dev, qa hits qa, prod hits
      prod. Never cross environments — see feedback_evals_match_environment in
      project memory and SECURITY.md isolation rules.
    parameters:
      endpoint:
        type: string
      smoke:
        type: boolean
        default: false
      min_pass:
        type: integer
        default: 23
    steps:
      # Two-step structure: capture run output unconditionally, then enforce
      # the threshold in a separate gate step. That way store_artifacts
      # below always runs — failure logs are the most useful artifacts.
      - run:
          name: Run evals (capture output)
          command: |
            mkdir -p /tmp/eval-artifacts
            cd copilot/agent/evals
            python -m venv .venv
            source .venv/bin/activate
            pip install -q -r requirements.txt
            export EVAL_AGENT_ENDPOINT="<< parameters.endpoint >>"
            ARGS=""
            if [ "<< parameters.smoke >>" = "true" ]; then ARGS="--smoke"; fi
            python run_evals.py $ARGS 2>&1 | tee /tmp/eval-artifacts/eval-output.txt || true
            cp cases.json /tmp/eval-artifacts/cases.json
      - store_artifacts:
          path: /tmp/eval-artifacts
          destination: evals
      - run:
          name: Enforce pass threshold
          command: |
            PASSED=$(grep -E "^\s*TOTAL\s+[0-9]+/[0-9]+ passed" /tmp/eval-artifacts/eval-output.txt | awk '{print $2}' | cut -d/ -f1)
            REQUIRED=<< parameters.min_pass >>
            echo "Passed: $PASSED / required: $REQUIRED"
            if [ -z "$PASSED" ] || [ "$PASSED" -lt "$REQUIRED" ]; then
              echo "✗ Eval pass count below threshold"; exit 1
            fi

# ─── Jobs ────────────────────────────────────────────────────────────────
jobs:
  unit-test:
    executor: php
    steps:
      - checkout
      - run:
          name: Install PHP deps
          # The isolated suite needs no PHP extensions at runtime — it
          # exercises plain classes with no DB, no curl, no redis. Bypass
          # composer's platform-req check so we don't have to install a
          # full LAMP-style PHP image just to run unit tests.
          command: |
            composer install \
              --no-interaction --prefer-dist --no-scripts \
              --ignore-platform-reqs
      - run:
          name: Run isolated PHPUnit Copilot suite
          command: |
            mkdir -p /tmp/test-results
            ./vendor/bin/phpunit \
              -c phpunit-isolated.xml \
              --filter Copilot \
              --log-junit /tmp/test-results/junit.xml
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: phpunit

  eval-smoke-dev:
    executor: python
    steps:
      - checkout
      - run:
          name: Set Anthropic + Langfuse env (from CircleCI project vars)
          command: |
            echo "ANTHROPIC_API_KEY+LANGFUSE_* must be set as CircleCI project envs."
      - run-evals:
          endpoint: "https://copilot-agent-dev.up.railway.app/chat"
          smoke: true
          min_pass: 4

  deploy-dev:
    executor: railway
    steps:
      - checkout
      - install-railway-cli
      - railway-deploy:
          service: copilot-agent
          env_token: RAILWAY_TOKEN_DEV
          service_path: copilot/agent
          use_path_as_root: true
      - wait-for-url:
          url: "https://copilot-agent-dev.up.railway.app/health"
      - store_artifacts:
          path: /tmp/deploy-logs
          destination: railway-dev

  deploy-qa:
    executor: railway
    steps:
      - checkout
      - install-railway-cli
      - railway-deploy:
          service: copilot-agent
          env_token: RAILWAY_TOKEN_QA
          service_path: copilot/agent
          use_path_as_root: true
      - wait-for-url:
          url: "https://copilot-agent-qa.up.railway.app/health"
      - store_artifacts:
          path: /tmp/deploy-logs
          destination: railway-qa

  eval-full-qa:
    executor: python
    steps:
      - checkout
      - run-evals:
          endpoint: "https://copilot-agent-qa.up.railway.app/chat"
          smoke: false
          min_pass: 23

  deploy-prod:
    executor: railway
    steps:
      - checkout
      - install-railway-cli
      - railway-deploy:
          service: copilot-agent
          env_token: RAILWAY_TOKEN_PROD
          service_path: copilot/agent
          use_path_as_root: true
      - wait-for-url:
          url: "https://copilot-agent-production-41de.up.railway.app/health"
      - store_artifacts:
          path: /tmp/deploy-logs
          destination: railway-prod

  eval-full-prod:
    executor: python
    steps:
      - checkout
      - run-evals:
          endpoint: "https://copilot-agent-production-41de.up.railway.app/chat"
          smoke: false
          min_pass: 23

  # ─── OpenEMR lane ────────────────────────────────────────────────────
  #
  # Mirrors the agent lane env-by-env. `railway up` from the repo root
  # (no --path-as-root) so Railway uses the root Dockerfile that
  # extends openemr/openemr:flex. Each deploy is followed by a smoke
  # job that waits for login and runs the API-enable housekeeping.
  #
  # Per the project_railway_deploy_2026-04-30 memory: never set
  # EASY_DEV_MODE on prod openemr (entrypoint rsync loop), keep
  # OE_PASS=pass on each env, and don't touch MySQL services.

  deploy-openemr-dev:
    executor: railway
    steps:
      - checkout
      - install-railway-cli
      - railway-deploy:
          service: openemr
          env_token: RAILWAY_TOKEN_DEV
      - store_artifacts:
          path: /tmp/deploy-logs
          destination: openemr-dev

  smoke-openemr-dev:
    executor: railway
    steps:
      - checkout
      - openemr-smoke:
          base_url: "https://openemr-dev-59c5.up.railway.app"

  deploy-openemr-qa:
    executor: railway
    steps:
      - checkout
      - install-railway-cli
      - railway-deploy:
          service: openemr
          env_token: RAILWAY_TOKEN_QA
      - store_artifacts:
          path: /tmp/deploy-logs
          destination: openemr-qa

  smoke-openemr-qa:
    executor: railway
    steps:
      - checkout
      - openemr-smoke:
          base_url: "https://openemr-qa.up.railway.app"

  deploy-openemr-prod:
    executor: railway
    steps:
      - checkout
      - install-railway-cli
      - railway-deploy:
          service: openemr
          env_token: RAILWAY_TOKEN_PROD
      - store_artifacts:
          path: /tmp/deploy-logs
          destination: openemr-prod

  smoke-openemr-prod:
    executor: railway
    steps:
      - checkout
      - openemr-smoke:
          base_url: "https://openemr-production-971e.up.railway.app"

# ─── Workflows ───────────────────────────────────────────────────────────
workflows:
  test-deploy-promote:
    jobs:
      # ── Unit tests gate both deploy lanes ──────────────────────
      # Run the isolated PHPUnit Copilot suite once per push; both
      # the agent lane and the openemr lane require it.
      - unit-test

      # ── Agent lane: dev ────────────────────────────────────────
      - deploy-dev:
          requires: [unit-test]
          filters:
            branches:
              only: master
      - eval-smoke-dev:
          requires: [deploy-dev]

      # ── OpenEMR lane: dev ──────────────────────────────────────
      - deploy-openemr-dev:
          requires: [unit-test]
          filters:
            branches:
              only: master
      - smoke-openemr-dev:
          requires: [deploy-openemr-dev]

      # ── QA gate: BOTH lanes' dev-side checks must pass ─────────
      - hold-qa:
          type: approval
          requires: [eval-smoke-dev, smoke-openemr-dev]

      # ── Agent lane: qa ─────────────────────────────────────────
      - deploy-qa:
          requires: [hold-qa]
      - eval-full-qa:
          requires: [deploy-qa]

      # ── OpenEMR lane: qa ───────────────────────────────────────
      - deploy-openemr-qa:
          requires: [hold-qa]
      - smoke-openemr-qa:
          requires: [deploy-openemr-qa]

      # ── Prod gate: BOTH lanes' qa-side checks must pass ────────
      - hold-prod:
          type: approval
          requires: [eval-full-qa, smoke-openemr-qa]

      # ── Agent lane: prod ───────────────────────────────────────
      - deploy-prod:
          requires: [hold-prod]
      - eval-full-prod:
          requires: [deploy-prod]

      # ── OpenEMR lane: prod ─────────────────────────────────────
      - deploy-openemr-prod:
          requires: [hold-prod]
      - smoke-openemr-prod:
          requires: [deploy-openemr-prod]
