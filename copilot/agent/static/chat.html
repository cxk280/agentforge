<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Co-Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:        #0D1B2A;
    --navy-2:      #152A42;
    --teal:        #008C8C;
    --teal-soft:   rgba(0, 140, 140, 0.10);
    --teal-accent: #5FD0D0;
    --bg:          #F5F7F8;
    --surface:     #FFFFFF;
    --border:      #E4E5E8;
    --text:        #0D1B2A;
    --text-2:      #4F5662;
    --text-3:      #8A91A0;
    --red:         #D63E2E;
    --red-soft:    rgba(214, 62, 46, 0.10);
    --amber:       #F08C33;
    --green:       #26A65B;
    --shadow-card: 0 1px 2px rgba(13, 27, 42, 0.04), 0 4px 12px rgba(13, 27, 42, 0.04);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── App shell ─────────────────────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Header ────────────────────────────────────────────────────────────── */
  #header {
    background: var(--navy);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 700; letter-spacing: -0.2px;
  }
  .logo-mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff;
  }
  .logo-text { color: #fff; }
  .logo-text span { color: var(--teal-accent); font-weight: 700; }

  #patient-badge {
    margin-left: auto;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 4px 14px 4px 4px;
  }
  #patient-badge .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-accent) 100%);
    flex-shrink: 0;
  }
  #patient-badge .info { line-height: 1.25; min-width: 0; }
  #patient-badge .name { font-weight: 600; font-size: 13px; }
  #patient-badge .meta { color: rgba(255,255,255,0.6); font-size: 11px; }

  /* ── Messages ──────────────────────────────────────────────────────────── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }

  /* AI label above each assistant bubble */
  .ai-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .msg { display: flex; flex-direction: column; max-width: 100%; }
  .msg.user { align-items: flex-end; }
  /* Assistant messages get a 40px "AI" avatar to the left of the
     label/bubble column, matching the Figma "Patient Ready" mock. */
  .msg.assistant {
    align-items: flex-start;
    position: relative;
    padding-left: 52px;
  }
  .msg.assistant::before {
    content: 'AI';
    position: absolute;
    left: 0; top: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #E5EAF0;
    color: #4F5763;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center;
  }

  .bubble {
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    max-width: 85%;
    word-wrap: break-word;
  }
  .msg.user .bubble {
    background: var(--navy);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  /* Markdown rendering inside assistant bubbles */
  .bubble > *:first-child { margin-top: 0; }
  .bubble > *:last-child  { margin-bottom: 0; }
  .bubble h2, .bubble h3 {
    font-size: 14px; font-weight: 700; margin: 12px 0 6px;
    color: var(--navy);
  }
  .bubble p  { margin: 6px 0; }
  .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .bubble strong { font-weight: 600; }
  .bubble em { font-style: italic; }
  .bubble code {
    background: rgba(13, 27, 42, 0.06);
    border-radius: 4px; padding: 1px 6px;
    font-size: 12.5px; font-family: 'SF Mono', Menlo, monospace;
  }
  .bubble hr  { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble table {
    border-collapse: collapse; font-size: 12.5px;
    margin: 8px 0; width: 100%;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border);
    padding: 6px 10px; text-align: left;
  }
  .bubble th { background: rgba(13, 27, 42, 0.04); font-weight: 600; }

  /* Highlight rows: blockquotes render as colored data rows */
  .bubble blockquote {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 6px 0;
    font-size: 13.5px;
    color: var(--text);
    box-shadow: var(--shadow-card);
  }
  .bubble blockquote strong { color: var(--navy); }

  /* Source citation chips (rendered when response contains a Sources: line) */
  .sources {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .sources-label {
    font-size: 11px; color: var(--text-3);
    margin-right: 2px;
  }
  .source-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--teal-soft);
    color: var(--teal);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 11px; font-weight: 500;
  }
  .source-chip::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--teal);
  }

  /* ── Welcome / suggested questions ─────────────────────────────────────── */
  .suggested {
    margin-top: 4px;
    padding-left: 4px;
  }
  .suggested-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.6px; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .suggested-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.05s, box-shadow 0.15s;
    font-family: inherit;
  }
  .chip:hover {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-soft);
  }
  .chip:active { transform: translateY(1px); }

  /* ── Typing indicator ──────────────────────────────────────────────────── */
  .typing-bubble { display: inline-flex; align-items: center; gap: 4px; padding: 16px 18px; }
  .typing-bubble .dot {
    width: 7px; height: 7px;
    border-radius: 50%; background: var(--text-3);
    animation: typing-bounce 1.2s infinite;
  }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.30s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%           { transform: translateY(-5px); opacity: 1; }
  }
  .typing-status {
    margin-top: 6px; padding-left: 4px;
    font-size: 12px; color: var(--text-3); font-style: italic;
  }

  /* ── Error state ───────────────────────────────────────────────────────── */
  .bubble.error {
    background: var(--red-soft);
    border-color: rgba(214, 62, 46, 0.25);
    color: var(--red);
  }
  .bubble.error strong { color: var(--red); }
  .retry-btn {
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .retry-btn:hover { background: var(--red); color: #fff; }

  /* ── Loading splash ────────────────────────────────────────────────────── */
  #loading {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--text-3); font-size: 14px;
    flex-direction: column; gap: 12px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Input bar ─────────────────────────────────────────────────────────── */
  #input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    flex-shrink: 0;
  }
  #input-shell {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 6px 6px 6px 18px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #input-shell:focus-within {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-soft);
  }
  #input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    line-height: 1.45;
    resize: none;
    min-height: 28px;
    max-height: 120px;
    font-family: inherit;
    color: var(--text);
    padding: 6px 0;
  }
  #input::placeholder { color: var(--text-3); }
  /* Send button: rectangular pill with "Send →" text per Figma. */
  #send {
    flex-shrink: 0;
    height: 40px;
    padding: 0 18px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font: inherit;
    font-size: 14px; font-weight: 600;
    transition: background 0.15s, transform 0.05s;
  }
  #send::after {
    content: 'Send →';
  }
  #send:disabled { background: var(--text-3); cursor: not-allowed; opacity: 0.55; }
  #send:hover:not(:disabled) { background: #006f6f; }
  #send:active:not(:disabled) { transform: translateY(1px); }
  #send svg { display: none; }
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <div class="logo">
      <div class="logo-mark">✦</div>
      <div class="logo-text">Clinical<span>Co-Pilot</span></div>
    </div>
    <div id="patient-badge" hidden>
      <div class="avatar"></div>
      <div class="info">
        <div class="name" id="patient-name">Loading…</div>
        <div class="meta" id="patient-meta"></div>
      </div>
    </div>
  </header>

  <main id="messages">
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading patient…</span>
    </div>
  </main>

  <footer id="input-bar">
    <div id="input-shell">
      <textarea id="input" rows="1" placeholder="Ask about this patient…" disabled></textarea>
      <button id="send" disabled aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </footer>
</div>

<!-- Sourced as an external file, not inline, so the strict CSP
     `script-src 'self'` from the agent's security middleware
     allows it to run without needing 'unsafe-inline' or a per-request
     nonce. Same-origin (served by /static mount). -->
<script src="/static/chat.js" defer></script>
</body>
</html>
