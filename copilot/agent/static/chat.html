<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Co-Pilot</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:  #0D1B2A;
    --teal:  #008C8C;
    --light: #F0F4F8;
    --gray:  #6B7280;
    --amber: #F5A623;
    --white: #FFFFFF;
    --red:   #CC2222;
    --border:#D1D9E0;
  }

  html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: var(--light); }

  /* ── Header ── */
  #header {
    background: var(--navy);
    color: var(--white);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #header .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  #header .logo span { color: var(--teal); }
  #patient-badge {
    margin-left: auto;
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 13px;
    text-align: right;
    line-height: 1.4;
  }
  #patient-badge .name { font-weight: 600; }
  #patient-badge .pid  { color: rgba(255,255,255,0.6); font-size: 11px; }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Messages ── */
  .msg { display: flex; gap: 10px; max-width: 800px; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .msg.user .avatar     { background: var(--teal); color: var(--white); }
  .msg.assistant .avatar { background: var(--navy); color: var(--white); }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 680px;
  }
  .msg.user .bubble {
    background: var(--teal);
    color: var(--white);
    border-bottom-right-radius: 3px;
  }
  .msg.assistant .bubble {
    background: var(--white);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    color: #1a1a2e;
  }

  /* Markdown-ish rendering inside assistant bubbles */
  .bubble h3 { font-size: 13px; font-weight: 700; margin: 10px 0 4px; color: var(--navy); }
  .bubble h3:first-child { margin-top: 0; }
  .bubble p  { margin: 4px 0; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 4px 0; }
  .bubble li { margin: 2px 0; }
  .bubble strong { font-weight: 700; }
  .bubble em { font-style: italic; }
  .bubble code {
    background: var(--light); border-radius: 3px;
    padding: 1px 5px; font-size: 12px; font-family: monospace;
  }
  .bubble table {
    border-collapse: collapse; font-size: 12px;
    margin: 6px 0; width: 100%;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border);
    padding: 4px 8px; text-align: left;
  }
  .bubble th { background: var(--light); font-weight: 600; }
  .bubble hr  { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

  /* Typing indicator */
  .typing .dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--gray);
    margin: 0 2px; animation: bounce 1.2s infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40%           { transform: translateY(-6px); }
  }

  /* Error bubble */
  .bubble.error { border-color: var(--red); color: var(--red); background: #fff5f5; }

  /* ── Input bar ── */
  #input-bar {
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    outline: none;
    line-height: 1.5;
    font-family: inherit;
  }
  #input:focus { border-color: var(--teal); }
  #send {
    background: var(--teal);
    color: var(--white);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    height: 44px;
    white-space: nowrap;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  #send:hover:not(:disabled) { background: #006f6f; }

  /* ── Loading state ── */
  #loading {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--gray); font-size: 14px;
    flex-direction: column; gap: 8px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div class="logo">Clinical <span>Co-Pilot</span></div>
    <div id="patient-badge">
      <div class="name" id="patient-name">Loading…</div>
      <div class="pid"  id="patient-id-display"></div>
    </div>
  </div>

  <div id="messages">
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading patient…</span>
    </div>
  </div>

  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="Ask about this patient…" disabled></textarea>
    <button id="send" disabled>Send</button>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const params     = new URLSearchParams(location.search);
const PID        = params.get('pid') || '';       // internal OpenEMR pid
const SESSION_ID = 'sess-' + Math.random().toString(36).slice(2);

// The agent backend URL — set via ?backend= param or defaults to same origin
const BACKEND = params.get('backend') || (location.origin.includes('8300')
  ? 'http://localhost:8400'   // OpenEMR serves on 8300, agent on 8400
  : location.origin);

let FHIR_ID  = params.get('fhir_id') || '';  // pre-resolved FHIR UUID (optional)
let busy     = false;

// ── Init ─────────────────────────────────────────────────────────────────
async function init() {
  if (!PID && !FHIR_ID) {
    showError('No patient selected. Open a patient chart in OpenEMR first.');
    return;
  }

  try {
    // Resolve internal pid → FHIR UUID if needed
    if (!FHIR_ID && PID) {
      const res  = await fetch(`${BACKEND}/api/patient-fhir-id/${PID}`);
      const data = await res.json();
      if (!data.fhir_id) throw new Error(data.detail || 'Patient not found');
      FHIR_ID = data.fhir_id;
      document.getElementById('patient-name').textContent = data.name || 'Patient';
      document.getElementById('patient-id-display').textContent = `PID ${PID}`;
    } else if (FHIR_ID) {
      document.getElementById('patient-name').textContent = 'Patient';
      document.getElementById('patient-id-display').textContent = FHIR_ID.slice(0, 8) + '…';
    }

    // Fetch patient summary to show name
    if (PID) {
      const res  = await fetch(`${BACKEND}/api/patient-fhir-id/${PID}`);
      const data = await res.json();
      if (data.name) document.getElementById('patient-name').textContent = data.name;
    }

    clearLoading();
    enableInput();

    appendWelcome();
  } catch (e) {
    showError('Could not load patient: ' + e.message);
  }
}

function appendWelcome() {
  const name = document.getElementById('patient-name').textContent;
  appendMessage('assistant',
    `Ready for **${name}**. Ask me anything — conditions, medications, labs, vitals, or visit history.`
  );
}

// ── UI helpers ────────────────────────────────────────────────────────────
function clearLoading() {
  document.getElementById('loading').remove();
}

function enableInput() {
  document.getElementById('input').disabled  = false;
  document.getElementById('send').disabled   = false;
  document.getElementById('input').focus();
}

function showError(msg) {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `<div class="msg assistant">
    <div class="avatar">!</div>
    <div class="bubble error">${msg}</div>
  </div>`;
}

function appendMessage(role, text) {
  const msgs  = document.getElementById('messages');
  const div   = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? 'Dr' : 'AI'}</div>
    <div class="bubble">${renderMarkdown(text)}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function appendTyping() {
  const msgs = document.getElementById('messages');
  const div  = document.createElement('div');
  div.id = 'typing';
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="avatar">AI</div>
    <div class="bubble typing">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

// Very minimal Markdown renderer (bold, italic, headers, tables, bullets, hr)
function renderMarkdown(text) {
  // Escape HTML first
  let s = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Tables
  s = s.replace(/^(\|.+)\n(\|[-| :]+)\n((?:\|.+\n?)+)/gm, (_, head, sep, body) => {
    const th = head.trim().split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(row => {
      const tds = row.trim().split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
  });

  // HR
  s = s.replace(/^---+$/gm, '<hr>');
  // Headers
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  // Bold + italic
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,         '<em>$1</em>');
  // Code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bullet lists
  s = s.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>\n?)+/gs, m => `<ul>${m}</ul>`);
  // Numbered lists
  s = s.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Line breaks
  s = s.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
  // Wrap orphan text
  if (!s.startsWith('<')) s = `<p>${s}</p>`;

  return s;
}

// ── Send message ─────────────────────────────────────────────────────────
async function send() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || busy || !FHIR_ID) return;

  busy = true;
  document.getElementById('send').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  appendMessage('user', text);
  const typingEl = appendTyping();

  try {
    const res = await fetch(`${BACKEND}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: SESSION_ID,
        patient_id: FHIR_ID,
        message: text,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Server error');
    }

    const data = await res.json();
    removeTyping();
    appendMessage('assistant', data.reply);
  } catch (e) {
    removeTyping();
    appendMessage('assistant', `⚠️ Error: ${e.message}`);
  } finally {
    busy = false;
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

// ── Event listeners ───────────────────────────────────────────────────────
document.getElementById('send').addEventListener('click', send);
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
// Auto-resize textarea
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

init();
</script>
</body>
</html>
