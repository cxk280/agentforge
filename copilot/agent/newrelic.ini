; New Relic Python agent configuration for the Clinical Co-Pilot.
;
; License key, app name, and environment are sourced from env vars
; (NEW_RELIC_LICENSE_KEY, NEW_RELIC_APP_NAME, NEW_RELIC_ENVIRONMENT)
; set on the Railway service so the same image works across dev/qa/prod.
;
; HIPAA posture: PHI may pass through this service. We rely on
; agent-side scrubbing (attributes.exclude, record_sql=obfuscated,
; strip_exception_messages.enabled=true) rather than NR's account-level
; High Security Mode, because HSM is an irreversible account toggle
; that supersedes per-agent settings and prevents the agent from
; registering when the account doesn't have it enabled. The BAA
; assumption documented in README.md is load-bearing for any real
; deployment.
;
; Docs: https://docs.newrelic.com/docs/apm/agents/python-agent/configuration/python-agent-configuration/

[newrelic]
app_name = AgentForge Co-Pilot
monitor_mode = true
log_level = info
log_file = stderr
high_security = false
strip_exception_messages.enabled = true

distributed_tracing.enabled = true
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
error_collector.enabled = true
error_collector.ignore_status_codes = 401 403 404 429
browser_monitoring.auto_instrument = false

application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.forwarding.max_samples_stored = 10000
application_logging.metrics.enabled = true
application_logging.local_decorating.enabled = false

attributes.exclude =
    request.headers.cookie
    request.headers.authorization
    request.headers.proxyAuthorization
    request.headers.setCookie*
    request.headers.x-*
    request.parameters.*
    response.headers.cookie
    response.headers.authorization

[newrelic:development]
monitor_mode = false

[newrelic:qa]
app_name = AgentForge Co-Pilot (QA)

[newrelic:production]
app_name = AgentForge Co-Pilot
